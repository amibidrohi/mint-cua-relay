name: Release build verification

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify tag, test, and build unsigned assets
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
          PY
          python -m pip install -e '.[test]'
          pytest
          python -m compileall -q src hermes-plugin tests
          bash -n install.sh scripts/*.sh scripts/mint-cua
          scripts/build-release.sh
          (cd dist && sha256sum --check --strict *.sha256)
          test -f release-public-key.pem
          tar -tzf dist/*.tar.gz | grep -Fx "mint-cua-relay-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')/release-public-key.pem"
          test ! -e dist/*.sha256.sig
